<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>QVAC Get Well Soon Message Writer</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    background: linear-gradient(160deg, #eefaf2 0%, #d3f0dd 100%);
    font-family: system-ui, sans-serif;
    color: #1a4a2e;
    display: flex;
    justify-content: center;
    padding: 46px 20px;
  }
  .wrap { width: 100%; max-width: 480px; text-align: center; }
  .icon { font-size: 2rem; margin-bottom: 4px; }
  h1 { font-size: 1.5rem; margin: 0 0 6px; color: #1f8a4c; font-weight: 800; }
  .subtitle { color: #4a7a5e; margin-bottom: 24px; font-size: 0.9rem; }
  .card {
    background: #fff;
    border-radius: 18px;
    padding: 28px 24px;
    box-shadow: 0 10px 30px rgba(31,138,76,0.12);
  }
  input[type=text] {
    width: 100%;
    padding: 12px 14px;
    border-radius: 12px;
    border: 2px solid #c3ecd3;
    background: #f6fdf9;
    color: #1a4a2e;
    font-family: inherit;
    font-size: 1rem;
    margin-bottom: 12px;
    text-align: center;
  }
  button.action {
    padding: 12px 28px;
    border: none;
    border-radius: 999px;
    font-size: 1rem;
    font-weight: 700;
    font-family: inherit;
    cursor: pointer;
    background: #23a15a;
    color: #fff;
    margin-top: 8px;
  }
  button.action:disabled { opacity: 0.4; cursor: not-allowed; }
  .status { margin-top: 14px; font-size: 0.85rem; color: #4a7a5e; min-height: 1.2em; }
  .result-text {
    text-align: left;
    font-size: 1.05rem;
    line-height: 1.6;
    margin-top: 20px;
    background: #eefaf2;
    border-radius: 12px;
    padding: 16px 18px;
    color: #1a4a2e;
  }
  .footer-note { color: #4a7a5e; font-size: 0.78rem; margin-top: 20px; }
  .spinner {
    display: inline-block;
    width: 13px; height: 13px;
    border: 2px solid #d3f0dd;
    border-top-color: #23a15a;
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
    vertical-align: middle;
    margin-right: 8px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>
  <div class="wrap">
    <div class="icon">🌻</div>
    <h1>QVAC Get Well Soon Message Writer</h1>
    <p class="subtitle">Enter their name and situation, get a caring message. 100% on-device.</p>

    <div class="card">
      <input type="text" id="nameInput" placeholder="Their name, e.g. Priya" />
      <input type="text" id="situationInput" placeholder="Situation, e.g. recovering from surgery" />
      <button class="action" id="generateBtn">Write Message</button>
      <div class="status" id="status"></div>
      <div id="resultBox"></div>
    </div>

    <p class="footer-note">Everything runs locally on your machine. No text ever leaves this device.</p>
  </div>

  <script>
    function escapeHtml(str) {
      const div = document.createElement('div');
      div.textContent = str;
      return div.innerHTML;
    }

    const nameInput = document.getElementById('nameInput');
    const situationInput = document.getElementById('situationInput');
    const generateBtn = document.getElementById('generateBtn');
    const status = document.getElementById('status');
    const resultBox = document.getElementById('resultBox');

    async function generate() {
      const name = nameInput.value.trim();
      if (!name) return;
      const situation = situationInput.value.trim();
      generateBtn.disabled = true;
      resultBox.innerHTML = '';
      status.innerHTML = '<span class="spinner"></span>Writing your message...';

      try {
        const res = await fetch('/api/getwell', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ name, situation }),
        });
        const data = await res.json();
        if (data.error) throw new Error(data.error);

        status.textContent = '';
        resultBox.innerHTML = `<div class="result-text">${escapeHtml(data.message)}</div>`;
      } catch (err) {
        status.textContent = 'Error: ' + err.message;
      } finally {
        generateBtn.disabled = false;
      }
    }

    generateBtn.addEventListener('click', generate);
    situationInput.addEventListener('keydown', (e) => { if (e.key === 'Enter') generate(); });
  </script>
</body>
</html>
